<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; padding: 12px; background: #ffffff; color: #0f172a; }
    h3 { margin-top: 0; color: #059669; font-size: 14px; }
    textarea { width: 100%; height: 90px; background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 11px; font-family: monospace; }
    button { width: 100%; margin-top: 8px; background: #059669; color: #ffffff; font-weight: bold; border: none; padding: 8px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #047857; }
  </style>
</head>
<body>
  <h3>Pune Rent Agreement Auto-Fill</h3>
  <p style="font-size: 11px; color: #64748b;">Paste exported IGR JSON packet below:</p>
  <textarea id="jsonInput" placeholder='{"header": {...}, "licensor": {...}}'></textarea>
  <button id="btnFill">Auto-Fill Form</button>

  <script>
    document.getElementById('btnFill').addEventListener('click', () => {
      try {
        const raw = document.getElementById('jsonInput').value;
        const parsed = JSON.parse(raw);
        chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
          if (tabs[0]?.id) {
            chrome.tabs.sendMessage(tabs[0].id, { action: "AUTOFILL_IGR", data: parsed });
          }
        });
      } catch(e) {
        alert("Invalid JSON format");
      }
    });
  </script>
</body>
</html>
